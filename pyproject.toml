[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geocentric"
dynamic = ["version"]
description = "Geocentric — train a causal language model from scratch"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.4.0",
    "tokenizers>=0.20.0,<1.0.0",
    "numpy>=1.26.0,<3.0.0",
    "tqdm>=4.66.0,<5.0.0",
]

[project.optional-dependencies]
data = ["datasets>=2.19.0", "requests>=2.31.0"]
vision = ["pillow>=10.0.0"]
dev = ["pytest>=8.0.0", "pillow>=10.0.0"]

[project.scripts]
geocentric = "geocentric.cli:main"

[tool.hatch.version]
path = "geocentric/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["geocentric"]

[tool.pytest.ini_options]
testpaths = ["tests"]
